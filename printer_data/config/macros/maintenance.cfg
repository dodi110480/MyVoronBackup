[gcode_macro TEST_FILAMETRIX_CUT]
description: Testet Filametrix Cutter und Retract (Positionen aus Happy Hare)
gcode:
  {% set retract_length = 50 %}
  {% set retract_speed = 25 %}
  {% set center_x = 175 %}
  {% set center_y = 175 %}

  # Cutter-Geometrie kommt aus Happy Hare (config/mmu/base/mmu_macro_vars.cfg,
  # live unter 'gcode_macro _MMU_CUT_TIP_VARS'). Damit wandert der Test mit,
  # wenn der Depressor-Pin mechanisch versetzt wird. Der hier früher hart
  # kodierte Punkt X0/Y29.5 war die alte Front-Position; seit dem Umbau sitzt
  # der Cutter hinten links (Pin 16/357) und die alten Werte waren falsch.
  {% set cut = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
  {% set pin_x = cut.pin_loc_xy[0]|float %}
  {% set pin_y = cut.pin_loc_xy[1]|float %}
  {% set comp_x = cut.pin_loc_compressed_xy[0]|float %}
  {% set comp_y = cut.pin_loc_compressed_xy[1]|float %}
  {% set park = cut.pin_park_dist|float %}
  {% set axis = cut.cutting_axis|lower %}

  # Startpunkt liegt um pin_park_dist auf der Schnittachse vor dem Pin
  {% if axis == 'y' %}
    {% set start_x = pin_x %}
    {% set start_y = pin_y + park %}
  {% else %}
    {% set start_x = pin_x + park %}
    {% set start_y = pin_y %}
  {% endif %}

  # Vor dem Fahren prüfen: ein veralteter Pin-Wert soll eine klare Meldung
  # geben und nicht mitten im Makro als "Move out of range" abbrechen.
  {% set xmin = printer.configfile.settings.stepper_x.position_min|float %}
  {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ymin = printer.configfile.settings.stepper_y.position_min|float %}
  {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
  {% set in_range = start_x >= xmin and start_x <= xmax and start_y >= ymin and start_y <= ymax and comp_x >= xmin and comp_x <= xmax and comp_y >= ymin and comp_y <= ymax %}

  M118 === Starte Filametrix Cutter-Test ===

  {% if not in_range %}
    M118 !! Cutter-Pin außerhalb des Fahrbereichs: X {pin_x} Y {pin_y}
    M118 !! Start X {start_x} Y {start_y} / Ziel X {comp_x} Y {comp_y}
    M118 !! Erlaubt ist X {xmin}..{xmax}, Y {ymin}..{ymax} — Test abgebrochen
  {% else %}
    {% if not printer.toolhead.homed_axes == "xyz" %}
      M118 Drucker ist nicht ge-homed – führe G28 aus...
      G28
    {% endif %}

    {% set oldx = printer.gcode_move.gcode_position.x %}
    {% set oldy = printer.gcode_move.gcode_position.y %}
    {% set oldz = printer.gcode_move.gcode_position.z %}
    # Nach G28 oder direkt nach RESTART steht die Gcode-Position auf 0/0/0, die
    # Düse steht real aber auf dem Bett. Eine Rückkehr auf Z0 würde sie – durch
    # den Retract dann 180 °C heiß – über die Platte schleifen. Unter 5 mm gilt
    # die gemerkte Z deshalb als unbrauchbar, es wird auf 30 mm ausgewichen.
    {% if oldz < 5 %}
      {% set oldz = 30 %}
    {% endif %}

    M118 -> Cutter-Pin X {pin_x} Y {pin_y} (Achse {axis}), Start X {start_x} Y {start_y}
    G90
    G1 Z30 F6000
    G1 X{start_x} Y{start_y} F{(cut.travel_speed * 60)|int}

    M118 -> Cutter auslösen bis X {comp_x} Y {comp_y}
    G1 X{comp_x} Y{comp_y} F1800
    G4 P500

    M118 -> Cutter entlasten
    G1 X{start_x} Y{start_y} F3000

    M118 -> Fahre zur Bettmitte
    G1 X{center_x} Y{center_y} F6000

    # Retract braucht eine heiße Düse: Klipper kennt kein M302 (am 29.10.2026
    # gegen /printer/gcode/help geprüft: 305 Befehle, kein Treffer; auch nicht
    # in den Quellen). Kalt extrudieren wäre ohnehin falsch – unter
    # min_extrude_temp ist das Filament im Hotend erstarrt, ein 50-mm-Retract
    # würde den Extruder nur überspringen lassen. FORCE_MOVE umginge die
    # Prüfung ebenfalls und versteckte das Problem nur. Also: bei Bedarf
    # aufheizen, danach wieder aus.
    # Hinweis: Das tropft ggf. etwas – Test bei leerem Bett ausführen.
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set retract_temp = (min_temp + 10)|int %}
    {% set needs_heat = printer.extruder.temperature < retract_temp %}

    {% if needs_heat %}
      M118 -> Düse kalt ({printer.extruder.temperature|round(0)|int}°C) - heize auf {retract_temp}°C
      M109 S{retract_temp}
    {% endif %}

    M118 -> Ziehe {retract_length}mm Filament bei {retract_speed}mm/s zurück
    G91
    G1 E-{retract_length} F{retract_speed * 60}
    G90

    {% if needs_heat %}
      M118 -> Heizung wieder aus
      M104 S0
    {% endif %}

    M118 -> Rückkehr zur ursprünglichen Position
    # Erst in Z, dann in X/Y: eine gleichzeitige Fahrt schiebt die Düse schräg
    # durch eventuell vorhandene Bauteile.
    G1 Z{oldz} F6000
    G1 X{oldx} Y{oldy} F6000

    M118 === Filametrix-Test abgeschlossen ===
  {% endif %}
